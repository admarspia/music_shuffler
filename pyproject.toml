[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-shuffle"
version = "0.2.0"
description = "Create persistent filename-based music shuffles with unique random prefixes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abrham Aragie" }]
keywords = ["music", "shuffle", "playlist", "filename", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]

[project.scripts]
music-shuffle = "music_shuffle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
